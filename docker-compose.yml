# ==============================================================================
# Docker Compose: Security Incident Case Management System
# Demonstrates container orchestration and local data persistence
# ==============================================================================

version: '3.8'

services:
  soc-incident-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security_incident_management
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - SECRET_KEY=soc-devops-project-secure-key-2026
      - DATABASE_URL=sqlite:////app/instance/incidents.db
    volumes:
      # Persistent SQLite database storage on host
      - ./instance:/app/instance
      # Persistent application logs for monitoring
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
